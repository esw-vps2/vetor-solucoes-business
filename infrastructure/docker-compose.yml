# Local development with hot reload
# Run from the monorepo root:
#   npm run docker:up
#   docker compose -f infrastructure/docker-compose.yml \
#     --env-file infrastructure/.env.backend \
#     --env-file infrastructure/.env.frontend \
#     --env-file infrastructure/.env.database \
#     up --build

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      device: ./repository/postgres
      o: bind
  backend_logs:
    driver: local
    driver_opts:
      type: none
      device: ./repository/logs
      o: bind
  backend_files:
    driver: local
    driver_opts:
      type: none
      device: ./repository/files
      o: bind
  backend_root_node_modules:
  backend_node_modules:
  frontend_root_node_modules:
  frontend_node_modules:
  frontend_next:
  redis_data:
    driver: local
    driver_opts:
      type: none
      device: ./repository/redis
      o: bind
  rabbitmq_data:
    driver: local
    driver_opts:
      type: none
      device: ./repository/rabbitmq
      o: bind
  worker_root_node_modules:
  worker_node_modules:

services:
  postgres:
    image: postgres:16-alpine
    container_name: vetor_database
    restart: unless-stopped
    env_file:
      - .env.database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  backend:
    container_name: vetor_backend
    build:
      context: ..
      dockerfile: infrastructure/dockerfile.backend.yml
      target: development
    image: vetor_backend:dev
    restart: unless-stopped
    command: sh -c "npm run start:dev"
    working_dir: /app/backend
    env_file:
      - .env.backend
    environment:
      TENANT_FILES_ROOT: /app/files
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    volumes:
      - ../backend:/app/backend
      - ../package.json:/app/package.json:ro
      - ../package-lock.json:/app/package-lock.json:ro
      - backend_root_node_modules:/app/node_modules
      - backend_node_modules:/app/backend/node_modules
      - backend_logs:/app/logs
      - backend_files:/app/files
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: vetor_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vetor}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

  worker:
    container_name: vetor_ai_worker
    build:
      context: ..
      dockerfile: infrastructure/dockerfile.worker.yml
      target: development
    image: vetor_ai_worker:dev
    restart: unless-stopped
    command: npm run start:dev --workspace worker-proxy-agent-ia
    working_dir: /app
    env_file:
      - .env.backend
    mem_limit: ${AI_WORKER_MEMORY:-512m}
    cpus: ${AI_WORKER_CPUS:-1}
    environment:
      TENANT_FILES_ROOT: /app/files
    volumes:
      - backend_files:/app/files
      - ../backend:/app/backend
      - ../worker-proxy-agent-ia:/app/worker-proxy-agent-ia
      - ../package.json:/app/package.json:ro
      - ../package-lock.json:/app/package-lock.json:ro
      - worker_root_node_modules:/app/node_modules
      - worker_node_modules:/app/worker-proxy-agent-ia/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app

  redis:
    image: redis:7.2-alpine
    container_name: vetor_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app

  powerbi:
    container_name: vetor_powerbi
    build:
      context: ../ms-powerbi-embedded
      dockerfile: Dockerfile
    image: vetor_powerbi:dev
    restart: unless-stopped
    env_file:
      - path: .env.powerbi
        required: true
    environment:
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app

  frontend:
    container_name: vetor_frontend
    build:
      context: ..
      dockerfile: infrastructure/dockerfile.frontend.yml
      target: dev
    image: vetor_frontend:dev
    restart: unless-stopped
    command: sh -c "npm run dev -- --hostname 0.0.0.0 --port ${FRONTEND_PORT:-3000}"
    working_dir: /app/frontend
    env_file:
      - .env.frontend
    environment:
      NODE_ENV: development
      PORT: ${FRONTEND_PORT:-3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
      API_INTERNAL_URL: http://backend:3001
    ports:
      - '${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}'
    volumes:
      - ../frontend:/app/frontend
      - ../package.json:/app/package.json:ro
      - ../package-lock.json:/app/package-lock.json:ro
      - frontend_root_node_modules:/app/node_modules
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_next:/app/frontend/.next
    depends_on:
      - backend
    networks:
      - app
