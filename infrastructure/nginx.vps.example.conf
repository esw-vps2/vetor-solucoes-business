# Reverse proxy example for production hosts such as vps2.com.br.
# The default nginx client body limit (1m) rejects project document uploads
# before NestJS runs. Project files allow up to 5 MiB each and 500 MiB per tree.
#
# Install: copy or include this file from your site config and reload nginx.

upstream vetor_frontend {
  server 127.0.0.1:3000;
}

upstream vetor_backend {
  server 127.0.0.1:3001;
}

server {
  listen 443 ssl http2;
  server_name vps2.com.br app.vps2.com.br;

  client_max_body_size 512m;

  location /api/v1/ {
    client_max_body_size 512m;
    proxy_pass http://vetor_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
  }

  location / {
    proxy_pass http://vetor_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512m;
  }
}
