# Independent AI worker. It loads the compiled backend worker module and does
# not start the public product API.
# Build: docker build -f infrastructure/dockerfile.worker.yml --target runner -t app-ai-worker .
# Context: monorepo root

ARG NODE_VERSION=22-alpine

FROM node:${NODE_VERSION} AS development

RUN mkdir /app && chown node:node /app && \
  apk add --no-cache g++ make python3 && \
  rm -vrf /var/cache/apk/*

WORKDIR /app

ENV NODE_PATH=/app/node_modules:/app/backend/node_modules:/app/worker-proxy-agent-ia/node_modules

COPY --chown=node:node package.json package-lock.json ./
COPY --chown=node:node backend/package.json ./backend/package.json
COPY --chown=node:node frontend/package.json ./frontend/package.json
COPY --chown=node:node worker-proxy-agent-ia/package.json ./worker-proxy-agent-ia/package.json

USER node
RUN --mount=type=cache,target=/home/node/.npm,uid=1000,gid=1000 \
  npm ci --workspace backend --workspace worker-proxy-agent-ia && \
  mkdir -p /app/backend/node_modules /app/worker-proxy-agent-ia/node_modules && \
  test -d /app/node_modules

COPY --chown=node:node backend ./backend
COPY --chown=node:node worker-proxy-agent-ia ./worker-proxy-agent-ia

EXPOSE 3002
CMD ["npm", "run", "start:dev", "--workspace", "worker-proxy-agent-ia"]

FROM node:${NODE_VERSION} AS builder

RUN mkdir /app && chown node:node /app && \
  apk add --no-cache g++ make python3 && \
  rm -vrf /var/cache/apk/*

WORKDIR /app

COPY --chown=node:node package.json package-lock.json ./
COPY --chown=node:node backend/package.json ./backend/package.json
COPY --chown=node:node frontend/package.json ./frontend/package.json
COPY --chown=node:node worker-proxy-agent-ia/package.json ./worker-proxy-agent-ia/package.json
COPY --chown=node:node --from=development /app/node_modules ./node_modules
COPY --chown=node:node --from=development /app/backend/node_modules ./backend/node_modules
COPY --chown=node:node --from=development /app/worker-proxy-agent-ia/node_modules ./worker-proxy-agent-ia/node_modules
COPY --chown=node:node backend ./backend
COPY --chown=node:node worker-proxy-agent-ia ./worker-proxy-agent-ia

USER node
RUN npm run build --workspace backend && \
  npm run build --workspace worker-proxy-agent-ia && \
  test -f backend/dist/modules/ai-agent/ai-worker.module.js && \
  test -f worker-proxy-agent-ia/dist/main.js

FROM node:${NODE_VERSION} AS runner

ARG APP_VERSION=0.0.0
ENV APP_VERSION=${APP_VERSION}
ENV NODE_ENV=production
ENV NODE_PATH=/app/node_modules:/app/backend/node_modules

WORKDIR /app

RUN mkdir -p /app && chown -R node:node /app

COPY --chown=node:node package.json package-lock.json ./
COPY --chown=node:node backend/package.json ./backend/package.json
COPY --chown=node:node frontend/package.json ./frontend/package.json
COPY --chown=node:node worker-proxy-agent-ia/package.json ./worker-proxy-agent-ia/package.json

RUN --mount=type=cache,target=/root/.npm \
  npm ci --omit=dev --workspace backend --workspace worker-proxy-agent-ia && \
  npm cache clean --force

COPY --chown=node:node --from=builder /app/backend/dist ./backend/dist
COPY --chown=node:node --from=builder /app/worker-proxy-agent-ia/dist ./worker-proxy-agent-ia/dist
RUN test -f /app/worker-proxy-agent-ia/dist/main.js && \
  test -f /app/backend/dist/modules/ai-agent/ai-worker.module.js

USER node
EXPOSE 3002
CMD ["node", "worker-proxy-agent-ia/dist/main.js"]
