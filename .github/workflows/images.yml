            echo "| Image | Uncompressed size |"
            echo "| --- | ---: |"
            echo "| \`${IMAGE}\` | ${size_human} (${size_bytes} bytes) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push frontend image to GHCR
