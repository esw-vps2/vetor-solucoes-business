        '401':
          description: Invalid credentials
        '404':
          description: Not found
        '429':
          description: Too many requests
components:
  securitySchemes:
    access-cookie:
      type: apiKey
      in: cookie
      name: access_token
    refresh-cookie:
      type: apiKey
      in: cookie
      name: refresh_token
  schemas:
    HealthCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - up
            - down
    HealthResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - healthy
            - unhealthy
        checks:
          type: object
          required:
            - api
            - database
            - smtp
          properties:
            api:
              $ref: '#/components/schemas/HealthCheck'
            database:
              $ref: '#/components/schemas/HealthCheck'
            smtp:
              $ref: '#/components/schemas/HealthCheck'
    CreateContact:
      type: object
      required:
        - customerName
        - customerEmail
        - projectDescription
      properties:
        customerName:
          type: string
          maxLength: 160
          example: Ana Silva
        customerEmail:
          type: string
          format: email
          maxLength: 255
          example: ana@example.com
        projectDescription:
          type: string
          maxLength: 5000
          example: Need a custom operations platform.
    Login:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          maxLength: 128
          example: ExamplePassword12!
    MfaChallenge:
      type: object
      required:
        - mfaRequired
        - challengeId
        - expiresAt
      properties:
        mfaRequired:
          type: boolean
          enum:
            - true
        challengeId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-01T12:30:00.000Z'
    LoginSession:
      allOf:
        - $ref: '#/components/schemas/SafeUser'
        - type: object
          required:
            - mfaRequired
          properties:
            mfaRequired:
              type: boolean
              enum:
                - false
    AiTokenPricing:
      type: object
      required:
        - aiTokenCostPerMillion
      properties:
        aiTokenCostPerMillion:
          type: number
          minimum: 0
          maximum: 999999
          example: 0.6
    TenantMfaSetting:
      type: object
      required:
        - id
        - name
        - slug
        - mfaEnabled
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Acme
        slug:
          type: string
          example: acme
        mfaEnabled:
          type: boolean
          example: false
    UpdateTenantMfa:
      type: object
      required:
        - mfaEnabled
      properties:
        mfaEnabled:
          type: boolean
          example: true
    MfaVerify:
      type: object
      required:
        - challengeId
        - token
      properties:
        challengeId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        token:
          type: string
          description: Decimal digits. Surrounding whitespace is removed before the digit check. At most 32 digits remain.
          pattern: '^\s*[0-9]{1,32}\s*$'
          example: '0'
    MfaResend:
      type: object
      required:
        - challengeId
      properties:
        challengeId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
    MfaCancel:
      type: object
      required:
        - challengeId
      properties:
        challengeId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
    EditUser:
      allOf:
        - $ref: '#/components/schemas/SafeUser'
        - type: object
          required:
            - status
          properties:
            status:
              type: string
              example: blocked
    SafeUser:
      type: object
      required:
        - id
        - tenantId
        - email
        - profile
        - firstName
        - lastName
        - age
        - sex
        - photoUrl
        - tenantPhotoUrl
        - tenantName
        - tenantSlug
        - enabledActions
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        tenantId:
          type: string
          format: uuid
          example: 22222222-2222-2222-2222-222222222222
        email:
          type: string
          format: email
          example: user@example.com
        profile:
          type: string
          enum:
            - Administrador
            - AdministradorTenant
            - Usuario
          example: Administrador
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Silva
        cargo:
          type: string
          maxLength: 160
          example: Product Manager
        age:
          type: integer
          example: 40
        sex:
          type: string
          enum:
            - M
            - F
            - O
          example: F
        photoUrl:
          type: string
          example: /api/v1/users/11111111-1111-4111-8111-111111111111/photo
        tenantPhotoUrl:
          type: string
          example: /api/v1/tenants/22222222-2222-2222-2222-222222222222/photo
        tenantName:
          type: string
          example: Acme
        tenantSlug:
          type: string
          example: acme
        enabledActions:
          type: array
          items:
            type: string
            enum:
              - painel
              - viewReports
              - createUser
              - editUser
              - viewProjects
              - manageProjects
              - moveCards
              - createLane
              - renameLane
              - deleteLane
              - createTenant
              - vetorAgent
          example:
            - painel
    TenantListItem:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
          example: 22222222-2222-2222-2222-222222222222
        name:
          type: string
          example: Acme
        slug:
          type: string
          example: acme
    CreateTenant:
      type: object
      additionalProperties: false
      required:
        - name
        - slug
      properties:
        name:
          type: string
          maxLength: 160
          example: Northwind
        slug:
          type: string
          maxLength: 80
          example: northwind
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
          example: ops@example.com
        photo:
          type: string
          format: binary
          description: Optional raster image, maximum 5 MB
    TenantCreated:
      type: object
      required:
        - id
        - name
        - slug
        - email
      properties:
        id:
          type: string
          format: uuid
          example: 33333333-3333-4333-8333-333333333333
        name:
          type: string
          example: Northwind
        slug:
          type: string
          example: northwind
        email:
          type: string
          format: email
          nullable: true
          example: ops@example.com
    CreateUser:
      type: object
      required:
        - tenantId
        - firstName
        - lastName
        - age
        - sex
        - email
        - password
      properties:
        tenantId:
          type: string
          format: uuid
          example: 22222222-2222-4222-8222-222222222222
        firstName:
          type: string
          maxLength: 160
          example: Nova
        lastName:
          type: string
          maxLength: 160
          example: User
        cargo:
          type: string
          maxLength: 160
          example: Product Manager
        age:
          type: integer
          minimum: 0
          maximum: 150
          example: 32
        sex:
          type: string
          enum:
            - M
            - F
            - O
          example: F
        email:
          type: string
          format: email
          example: nova@example.com
        password:
          type: string
          minLength: 6
          maxLength: 128
          pattern: '^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{6,128}$'
          description: At least 6 characters, including a letter, a number, and a special character.
          example: ExamplePassword12!
        enabledActions:
          type: array
          items:
            type: string
            enum:
              - painel
              - viewReports
              - createUser
              - editUser
              - viewProjects
              - manageProjects
              - moveCards
              - createLane
              - renameLane
              - deleteLane
              - createTenant
              - vetorAgent
          example:
            - painel
            - createUser
        profile:
          type: string
          enum:
            - Administrador
            - AdministradorTenant
          example: AdministradorTenant
          description: Only Administrador may set this. Administrador is the global profile. AdministradorTenant administers only the new user's home tenant.
        photo:
          type: string
          format: binary
          description: Optional raster image, maximum 5 MB
