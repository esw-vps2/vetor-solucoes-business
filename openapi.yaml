openapi: 3.0.3
info:
  title: VETOR API
  description: Published HTTP contract for the VETOR backend.
  version: '1.0'
servers:
  - url: http://localhost:3001
    description: Docker Compose backend
paths:
  /api/v1:
    get:
      tags:
        - health
      summary: Solution health statistics
      operationId: getHealth
      responses:
        '200':
          description: Every runtime check is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                checks:
                  api:
                    status: up
                  database:
                    status: up
                  smtp:
                    status: up
        '500':
          description: At least one runtime check is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: unhealthy
                checks:
                  api:
                    status: up
                  database:
                    status: down
                  smtp:
                    status: up
  /api/v1/contact:
    post:
      tags:
        - contact
      summary: Send a project inquiry by email
      operationId: createContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContact'
            example:
              customerName: Ana Silva
              customerEmail: ana@example.com
              projectDescription: Need a custom operations platform.
      responses:
        '204':
          description: Inquiry emailed
        '400':
          description: Invalid input
        '429':
          description: Too many requests
        '503':
          description: Email delivery failed
  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Check the password and continue with the home tenant MFA setting
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            example:
              email: user@example.com
              password: ExamplePassword12!
      responses:
        '200':
          description: MFA challenge when the home tenant requires the emailed code, or the safe user with session cookies when that tenant has MFA disabled.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MfaChallenge'
                  - $ref: '#/components/schemas/LoginSession'
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials, or the password matches more than one active account
        '429':
          description: Too many requests
        '503':
          description: Digit count is not configured, or email delivery failed
  /api/v1/auth/mfa/verify:
    post:
      tags:
        - auth
      summary: Accept the emailed MFA code and start the session
      operationId: verifyMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerify'
            example:
              challengeId: 11111111-1111-4111-8111-111111111111
              token: '0'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
              example:
                id: 11111111-1111-1111-1111-111111111111
                tenantId: 22222222-2222-2222-2222-222222222222
                email: user@example.com
                profile: Administrador
                firstName: Ana
                lastName: Silva
                age: 40
                sex: F
                photoUrl: /api/v1/users/11111111-1111-4111-8111-111111111111/photo
                tenantPhotoUrl: /api/v1/tenants/22222222-2222-2222-2222-222222222222/photo
                tenantName: Acme
                tenantSlug: acme
                enabledActions:
                  - painel
        '400':
          description: Invalid input
        '401':
          description: Invalid or expired code
        '403':
          description: Account blocked
        '429':
          description: Too many requests
  /api/v1/auth/mfa/resend:
    post:
      tags:
        - auth
      summary: Email a new MFA code after the current one expires
      operationId: resendMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaResend'
            example:
              challengeId: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Replacement MFA challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallenge'
              example:
                mfaRequired: true
                challengeId: 11111111-1111-4111-8111-111111111112
                expiresAt: '2026-10-01T13:00:00.000Z'
        '400':
          description: Invalid input
        '401':
          description: Invalid or expired code
        '429':
          description: Too many requests
        '503':
          description: Digit count is not configured, or email delivery failed
  /api/v1/auth/mfa/cancel:
    post:
      tags:
        - auth
      summary: Delete the emailed MFA challenge
      operationId: cancelMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCancel'
            example:
              challengeId: 11111111-1111-4111-8111-111111111111
      responses:
        '204':
          description: Challenge deleted, or no matching row
        '400':
          description: Invalid input
        '429':
          description: Too many requests
  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      summary: Rotate the refresh session
      operationId: refresh
      security:
        - refresh-cookie: []
      responses:
        '200':
          description: Rotated authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
              example:
                id: 11111111-1111-1111-1111-111111111111
                tenantId: 22222222-2222-2222-2222-222222222222
                email: user@example.com
                profile: Administrador
                firstName: Ana
                lastName: Silva
                age: 40
                sex: F
                photoUrl: /api/v1/users/11111111-1111-4111-8111-111111111111/photo
                tenantPhotoUrl: /api/v1/tenants/22222222-2222-2222-2222-222222222222/photo
                tenantName: Acme
                tenantSlug: acme
                enabledActions:
                  - painel
        '401':
          description: Invalid session
        '429':
          description: Too many requests
  /api/v1/auth/logout:
    post:
      tags:
        - auth
      summary: Revoke the current session
      operationId: logout
      security:
        - access-cookie: []
      responses:
        '204':
          description: Session revoked
        '401':
          description: Invalid credentials
  /api/v1/auth/session:
    get:
      tags:
        - auth
      summary: Return the authenticated user
      operationId: getSession
      security:
        - access-cookie: []
      responses:
        '200':
          description: Safe authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
              example:
                id: 11111111-1111-1111-1111-111111111111
                tenantId: 22222222-2222-2222-2222-222222222222
                email: user@example.com
                profile: Administrador
                firstName: Ana
                lastName: Silva
                age: 40
                sex: F
                photoUrl: /api/v1/users/11111111-1111-4111-8111-111111111111/photo
                tenantPhotoUrl: /api/v1/tenants/22222222-2222-2222-2222-222222222222/photo
                tenantName: Acme
                tenantSlug: acme
                enabledActions:
                  - painel
        '401':
          description: Invalid session
    patch:
      tags:
        - auth
      summary: Set the working session tenant for Administrador
      operationId: updateSessionTenant
      security:
        - access-cookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionTenant'
            example:
              tenantId: 22222222-2222-2222-2222-222222222222
      responses:
        '200':
          description: Updated session with the working tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
              example:
                id: 11111111-1111-1111-1111-111111111111
                tenantId: 22222222-2222-2222-2222-222222222222
                email: user@example.com
                profile: Administrador
                firstName: Ana
                lastName: Silva
                age: 40
                sex: F
                photoUrl: /api/v1/users/11111111-1111-4111-8111-111111111111/photo
                tenantPhotoUrl: /api/v1/tenants/22222222-2222-2222-2222-222222222222/photo
                tenantName: Acme
                tenantSlug: acme
                enabledActions:
                  - painel
        '400':
          description: Invalid input
        '401':
          description: Invalid session
        '403':
          description: Access denied
  /api/v1/auth/password-recovery/request:
    post:
      tags:
        - auth
      summary: Request a password recovery email
      operationId: requestPasswordRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
            example:
              email: user@example.com
      responses:
        '202':
          description: Generic accepted response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryAccepted'
              example:
                message: Se a conta existir, enviaremos instruções por e-mail.
        '400':
          description: Invalid input
        '429':
          description: Too many requests
  /api/v1/auth/password-recovery/verify:
    post:
      tags:
        - auth
      summary: Verify a password recovery token
      operationId: verifyPasswordRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryVerify'
            example:
              email: user@example.com
              token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      responses:
        '200':
          description: Reset challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryValid'
              example:
                valid: true
        '400':
          description: Invalid input
        '401':
          description: Invalid or expired recovery token
        '429':
          description: Too many requests
  /api/v1/auth/password-recovery/reset:
    post:
      tags:
        - auth
      summary: Reset the password with a valid token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryReset'
            example:
              email: user@example.com
              token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              password: ExamplePassword12!
              passwordConfirmation: ExamplePassword12!
      responses:
        '204':
          description: Password updated
        '400':
          description: Invalid input
        '401':
          description: Invalid or expired recovery token
        '429':
          description: Too many requests
  /api/v1/admin/tenant-settings:
    get:
      tags:
        - admin
      summary: List MFA settings for every tenant
      operationId: listTenantMfaSettings
      security:
        - access-cookie: []
      responses:
        '200':
          description: Every tenant, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantMfaSetting'
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
  /api/v1/admin/tenant-settings/{tenantId}:
    patch:
      tags:
        - admin
      summary: Set MFA for one tenant
      operationId: updateTenantMfaSetting
      security:
        - access-cookie: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantMfa'
      responses:
        '200':
          description: Updated tenant MFA setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMfaSetting'
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '404':
          description: Not found
  /api/v1/admin/ai-pricing:
    get:
      tags:
        - admin
      summary: Read the shared Agente Beta token price
      operationId: getAdminAiPricing
      security:
        - access-cookie: []
      responses:
        '200':
          description: One price in BRL per million tokens for every tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTokenPricing'
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
    patch:
      tags:
        - admin
      summary: Set the Agente Beta token price for every tenant
      operationId: updateAdminAiPricing
      security:
        - access-cookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiTokenPricing'
      responses:
        '200':
          description: Shared price written onto every tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTokenPricing'
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
  /api/v1/tenants:
    get:
      tags:
        - tenants
      summary: List tenants for user registration, Projetos, and Power BI distribution
      operationId: listTenants
      security:
        - access-cookie: []
      responses:
        '200':
          description: Every tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantListItem'
              example:
                - id: 22222222-2222-2222-2222-222222222222
                  name: Acme
                  slug: acme
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
    post:
      tags:
        - tenants
      summary: Register a tenant
      operationId: createTenant
      security:
        - access-cookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateTenant'
      responses:
        '201':
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreated'
              example:
                id: 33333333-3333-4333-8333-333333333333
                name: Northwind
                slug: northwind
                email: ops@example.com
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '409':
          description: Tenant already exists
  /api/v1/tenants/{id}/photo:
    get:
      tags:
        - tenants
      summary: Read a tenant photo
      operationId: getTenantPhoto
      security:
        - access-cookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Image bytes
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            Cross-Origin-Resource-Policy:
              schema:
                type: string
                example: cross-origin
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '404':
          description: Not found
    put:
      tags:
        - tenants
      summary: Replace a tenant photo
      operationId: replaceTenantPhoto
      security:
        - access-cookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  format: binary
                  description: Required raster image, maximum 5 MB
      responses:
        '204':
          description: Photo replaced
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '404':
          description: Not found
    delete:
      tags:
        - tenants
      summary: Remove a tenant photo
      operationId: deleteTenantPhoto
      security:
        - access-cookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Photo removed
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '404':
          description: Not found
  /api/v1/powerbi/workspaces:
    get:
      tags:
        - powerbi
      summary: List Power BI workspaces from the report service
      operationId: listPowerBiWorkspaces
      security:
        - access-cookie: []
      responses:
        '200':
          description: Workspace list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PowerBiWorkspace'
              example:
                - id: 33333333-3333-4333-8333-333333333333
                  name: Finance workspace
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '429':
          description: Too many requests
        '503':
          description: Report service unavailable
  /api/v1/powerbi/workspaces/{workspaceId}/reports:
    get:
      tags:
        - powerbi
      summary: List Power BI reports in a workspace
      operationId: listPowerBiWorkspaceReports
      security:
        - access-cookie: []
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report list from the report service
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PowerBiPythonReport'
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '429':
          description: Too many requests
        '503':
          description: Report service unavailable
  /api/v1/powerbi/workspaces/{workspaceId}/reports/{reportId}/pages:
    get:
      tags:
        - powerbi
      summary: List pages for a Power BI report
      operationId: listPowerBiWorkspaceReportPages
      security:
        - access-cookie: []
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: reportId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Page list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PowerBiPage'
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '429':
          description: Too many requests
        '503':
          description: Report service unavailable
  /api/v1/powerbi/relatorios:
    get:
      tags:
        - powerbi
      summary: List imported Power BI reports
      operationId: listPowerBiCatalog
      security:
        - access-cookie: []
      responses:
        '200':
          description: Imported catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PowerBiCatalogReport'
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
    post:
      tags:
        - powerbi
      summary: Import a Power BI report into the catalog
      operationId: importPowerBiReport
      security:
        - access-cookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePowerBiReport'
            example:
              workspaceId: 33333333-3333-4333-8333-333333333333
              reportId: 44444444-4444-4444-8444-444444444444
              nome: Revenue overview
              descricao: Monthly revenue overview
      responses:
        '201':
          description: Created catalog report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerBiCatalogReport'
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '409':
          description: Report already registered
        '429':
          description: Too many requests
        '503':
          description: Report service unavailable
  /api/v1/powerbi/relatorios/{id}:
    patch:
      tags:
        - powerbi
      summary: Update an imported report name and description
      operationId: updatePowerBiReport
      security:
        - access-cookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePowerBiReport'
      responses:
        '200':
          description: Updated catalog report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerBiCatalogReport'
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '404':
          description: Not found
  /api/v1/powerbi/relatorios/{id}/status:
    patch:
      tags:
        - powerbi
      summary: Activate or deactivate an imported report
      operationId: updatePowerBiReportStatus
      security:
        - access-cookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePowerBiStatus'
      responses:
        '200':
          description: Updated catalog report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerBiCatalogReport'
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '404':
          description: Not found
  /api/v1/powerbi/relatorios/{id}/distribuicoes:
    get:
      tags:
        - powerbi
      summary: List distributions for an imported report
      operationId: listPowerBiDistributions
      security:
        - access-cookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Distributions for the report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PowerBiDistribution'
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '404':
          description: Not found
    post:
      tags:
        - powerbi
      summary: Distribute an imported report to a tenant
      operationId: createPowerBiDistribution
      security:
        - access-cookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePowerBiDistribution'
      responses:
        '201':
          description: Created distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerBiDistribution'
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '404':
          description: Not found
        '409':
          description: Already distributed
  /api/v1/powerbi/distribuicoes/{id}:
    patch:
      tags:
        - powerbi
      summary: Update a report distribution
      operationId: updatePowerBiDistribution
      security:
        - access-cookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePowerBiDistribution'
      responses:
        '200':
          description: Updated distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerBiDistribution'
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials
        '403':
          description: Access denied
        '404':
          description: Not found
  /api/v1/powerbi/distribuicoes/{id}/status:
    patch:
      tags:
        - powerbi
      summary: Activate or deactivate a distribution
      operationId: updatePowerBiDistributionStatus
      security:
        - access-cookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePowerBiStatus'
      responses:
        '200':
          description: Updated distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerBiDistribution'
        '400':
          description: Invalid input
        '401':
