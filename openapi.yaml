      type: string
      enum:
        - duvida
        - suporte_tecnico
        - erro_falha
        - solicitacao_servico
        - financeiro_cobranca
        - melhoria
        - outros
    TicketStatus:
      type: string
      enum:
        - aberto
        - em_andamento
        - em_analise
        - resolvido
        - cancelado
    TicketPriority:
      type: string
      enum:
        - low
        - medium
        - high
    CreateTicket:
      type: object
      additionalProperties: false
      required: [title, category, description]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 160
        category:
          $ref: '#/components/schemas/TicketCategory'
        description:
          type: string
          minLength: 10
          maxLength: 5000
        priority:
          $ref: '#/components/schemas/TicketPriority'
    TicketAttachmentFile:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Allowlisted file, maximum 5 MB, maximum 10 per ticket
    UpdateTicketStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
    CreateTicketComment:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 2
          maxLength: 5000
    MarkTicketRead:
      type: object
      additionalProperties: false
    TicketPerson:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    TicketSummary:
      type: object
      required:
        - id
        - tenantId
        - tenantName
        - title
        - category
        - status
        - priority
        - createdAt
        - updatedAt
        - hasNewComments
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        title:
          type: string
        category:
          $ref: '#/components/schemas/TicketCategory'
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        hasNewComments:
          type: boolean
    TicketComment:
      type: object
      required: [id, ticketId, authorId, author, body, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/TicketPerson'
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TicketDetail:
      allOf:
        - $ref: '#/components/schemas/TicketSummary'
        - type: object
          required: [description, openedById, openedBy, tenant, comments, attachments]
          properties:
            description:
              type: string
            openedById:
              type: string
              format: uuid
            openedBy:
              $ref: '#/components/schemas/TicketPerson'
            tenant:
              $ref: '#/components/schemas/TicketPerson'
            comments:
              type: array
              items:
                $ref: '#/components/schemas/TicketComment'
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/TicketAttachment'
    TicketAttachment:
      type: object
      required:
        - id
        - ticketId
        - contentType
        - byteSize
        - originalName
        - url
        - createdByUserId
        - createdByFirstName
        - createdByLastName
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        contentType:
          type: string
          example: image/png
        byteSize:
          type: integer
          example: 1024
        originalName:
          type: string
          example: captura.png
        url:
          type: string
          example: /api/v1/tickets/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/attachments/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
        createdByUserId:
          type: string
          format: uuid
        createdByFirstName:
          type: string
        createdByLastName:
          type: string
    TicketMutation:
      type: object
      required: [message, ticket]
      properties:
        message:
          type: string
        ticket:
          $ref: '#/components/schemas/TicketDetail'
    TicketCommentMutation:
      type: object
      required: [message, comment]
      properties:
        message:
          type: string
        comment:
          $ref: '#/components/schemas/TicketComment'
    TicketList:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    ExpenseItem:
      type: object
      required:
        - id
        - description
        - categoryId
        - categoryName
        - amountCents
        - competenceMonth
        - expenseType
        - status
        - seriesDetached
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        subcategoryId:
          type: string
          format: uuid
          nullable: true
        subcategoryName:
          type: string
          nullable: true
        amountCents:
          type: integer
        competenceMonth:
          type: string
          example: '2026-10'
        expenseType:
          type: string
          enum: [fixed, variable, occasional]
        supplierName:
          type: string
          nullable: true
        dueOn:
          type: string
          nullable: true
        paidOn:
          type: string
          nullable: true
        paymentMethod:
          type: string
          nullable: true
        clientTenantId:
          type: string
          format: uuid
          nullable: true
        clientTenantName:
          type: string
          nullable: true
        projectId:
          type: string
          format: uuid
          nullable: true
        projectName:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, paid, cancelled]
        recurrence:
          type: string
          enum: [monthly, yearly]
          nullable: true
        seriesId:
          type: string
          format: uuid
          nullable: true
        seriesIndex:
          type: integer
          nullable: true
        seriesDetached:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExpenseDetail:
      allOf:
        - $ref: '#/components/schemas/ExpenseItem'
        - type: object
          properties:
            notes:
              type: string
              nullable: true
            documents:
              type: array
              items:
                $ref: '#/components/schemas/ExpenseDocument'
    ExpenseDocument:
      type: object
      required: [id, originalName, contentType, byteSize, createdAt]
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
        contentType:
          type: string
        byteSize:
          type: integer
        createdAt:
          type: string
          format: date-time
    ExpenseList:
      type: object
      required: [items, page, limit, total, summary]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseItem'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        summary:
          type: object
          required: [periodTotalCents, paidTotalCents, pendingTotalCents, count]
          properties:
            periodTotalCents:
              type: integer
            paidTotalCents:
              type: integer
            pendingTotalCents:
              type: integer
            count:
              type: integer
    ExpenseSeriesCreated:
      type: object
      required: [seriesId, generatedCount, firstExpenseId]
      properties:
        seriesId:
          type: string
          format: uuid
        generatedCount:
          type: integer
        firstExpenseId:
          type: string
          format: uuid
    ExpenseCancelResult:
      type: object
      required: [cancelledIds, alreadyCancelledIds]
      properties:
        cancelledIds:
          type: array
          items:
            type: string
            format: uuid
        alreadyCancelledIds:
          type: array
          items:
            type: string
            format: uuid
    ExpenseWrite:
      type: object
      properties:
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        amountCents:
          type: integer
        expenseType:
          type: string
          enum: [fixed, variable, occasional]
        competenceMonth:
          type: string
        status:
          type: string
          enum: [pending, paid, cancelled]
        paidOn:
          type: string
          nullable: true
        recurrence:
          type: object
          required: [interval, count, startsOn]
          properties:
            interval:
              type: string
              enum: [monthly, yearly]
            count:
              type: integer
            startsOn:
              type: string
        scope:
          type: string
          enum: [occurrence, series]
        count:
          type: integer
        startsOn:
          type: string
    ExpenseAssociations:
      type: object
      required: [tenants, projects]
      properties:
        tenants:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        projects:
          type: array
          items:
            type: object
            required: [id, name, tenantId, tenantName]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              tenantId:
                type: string
                format: uuid
              tenantName:
                type: string
    ExpenseCategoryName:
      type: object
      required: [name]
      properties:
        name:
          type: string
    ExpenseCategoryPatch:
      type: object
      properties:
        name:
          type: string
        active:
          type: boolean
    ExpenseSubcategory:
      type: object
      required: [id, slug, name, position, active, expenseCount]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        position:
          type: integer
        active:
          type: boolean
        expenseCount:
          type: integer
    ExpenseCategory:
      allOf:
        - $ref: '#/components/schemas/ExpenseSubcategory'
        - type: object
          properties:
            subcategories:
              type: array
              items:
                $ref: '#/components/schemas/ExpenseSubcategory'
  parameters:
    ExpenseId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    ExpenseDocumentId:
      in: path
      name: documentId
      required: true
      schema:
        type: string
        format: uuid
    ExpenseCategoryId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    ExpenseSubcategoryId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
