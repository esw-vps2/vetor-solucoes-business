    PasswordRecoveryVerify:
      type: object
      required:
        - token
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        token:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    PasswordRecoveryValid:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
          enum:
            - true
          example: true
    PasswordRecoveryReset:
      type: object
      required:
        - token
        - password
        - passwordConfirmation
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        token:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        password:
          type: string
          minLength: 6
          maxLength: 128
          pattern: '^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{6,128}$'
          description: At least 6 characters, including a letter, a number, and a special character.
          example: ExamplePassword12!
        passwordConfirmation:
          type: string
          minLength: 6
          maxLength: 128
          pattern: '^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{6,128}$'
          description: At least 6 characters, including a letter, a number, and a special character.
          example: ExamplePassword12!
