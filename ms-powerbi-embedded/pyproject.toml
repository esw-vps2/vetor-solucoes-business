[project]
name = "ms-powerbi-embedded"
version = "0.1.0"
description = "Microsserviço de integração com Power BI Embedded"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12",
    "msal>=1.32.3",
    "pydantic-settings>=2.9.1",
    "python-dateutil>=2.9.0.post0",
    "redis>=6.1.0",
    "requests>=2.32.3",
    "uvicorn>=0.34.2",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
